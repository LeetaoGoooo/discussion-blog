                长寿花算是我见过最有生命力的植物了，去年下半年买了一盆，随后也陆续买了两盆别的盆栽，再后来另外两盆的植物陆续都死了。为了不让两个花盆空置，我就从长寿花剪下了两个枝桠，分别插到另外的两个花盆了。再之后的日子里，也只是偶尔想起来给它们简单的浇了点水，没想到它们就活到了现在，也陆续开了几次的花。
